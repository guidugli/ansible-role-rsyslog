---
# defaults file for rsyslog

# Enable the opt-in CIS Ubuntu Level 1 client profile. When enabled, the role
# requires remote forwarding, prevents receiver mode, and manages logrotate.
rsyslog_cis_level1_enabled: false

# TCP port used when this host accepts remote syslog messages or forwards
# messages to a remote rsyslog endpoint.
rsyslog_port: 514

# Enable this host as a remote TCP log receiver. This must remain false when
# rsyslog_cis_level1_enabled is true.
rsyslog_enable_log_host: false

# Remote rsyslog endpoint. It is required when the CIS Level 1 profile is enabled.
rsyslog_log_server: ""

# Number of times to retry communication with the remote log server.
# Use -1 for infinite retries when the remote host is unavailable.
rsyslog_retry_count: -1

# Maximum disk space used by the rsyslog action queue.
rsyslog_max_disk_space: "1g"

# Save queued messages to disk during shutdown. Valid values: on, off.
rsyslog_save_on_shutdown: "on"

# Unique spool-file prefix for rsyslog forwarding queue files.
rsyslog_queue_filename: "fwdRule1"

# Manage an rsyslog-specific logrotate policy. This is automatically enabled
# when rsyslog_cis_level1_enabled is true.
rsyslog_manage_logrotate: false
rsyslog_logrotate_user: root
rsyslog_logrotate_group: adm
rsyslog_logrotate_frequency: weekly
rsyslog_logrotate_rotate: 13
rsyslog_logrotate_maxage: 90
rsyslog_logrotate_compress: true
rsyslog_logrotate_delaycompress: true
rsyslog_logrotate_paths:
  - /var/log/syslog
  - /var/log/auth.log
  - /var/log/cron.log
  - /var/log/daemon.log
  - /var/log/kern.log
  - /var/log/mail.log
  - /var/log/mail.info
  - /var/log/mail.warn
  - /var/log/mail.err
  - /var/log/messages
  - /var/log/secure
  - /var/log/maillog
  - /var/log/cron
  - /var/log/warn
