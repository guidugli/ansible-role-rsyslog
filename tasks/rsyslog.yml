---
- name: Ensure rsyslog is installed
  ansible.builtin.package:
    name: "{{ rsyslog_package }}"
    state: present
    update_cache: true
  tags:
    - rsyslog
    - install

- name: Ensure rsyslog TLS support package is installed
  ansible.builtin.package:
    name: "{{ rsyslog_tls_package }}"
    state: present
  when: rsyslog_tls_effective_enabled
  tags:
    - rsyslog
    - install

- name: Ensure rsyslog configuration directory exists
  ansible.builtin.file:
    path: "{{ rsyslogd_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - rsyslog
    - config

- name: Gather available local users
  ansible.builtin.getent:
    database: passwd
  tags:
    - rsyslog
    - config

- name: Check whether syslog account exists
  ansible.builtin.set_fact:
    syslog_user_exists: >-
      {{ 'syslog' in (ansible_facts['getent_passwd'] | default({})) }}
  changed_when: false
  tags:
    - rsyslog
    - config

- name: Check rsyslog TLS CA certificate file
  ansible.builtin.stat:
    path: "{{ rsyslog_tls_ca_file }}"
  register: rsyslog_tls_ca_file_stat
  when: rsyslog_tls_effective_enabled
  tags:
    - rsyslog
    - validate

- name: Validate rsyslog TLS CA certificate file
  ansible.builtin.assert:
    that:
      - rsyslog_tls_ca_file_stat.stat.exists
      - rsyslog_tls_ca_file_stat.stat.isreg
    fail_msg: >-
      rsyslog TLS forwarding requires rsyslog_tls_ca_file to point to an
      existing regular CA certificate file.
    quiet: true
  when: rsyslog_tls_effective_enabled
  tags:
    - rsyslog
    - validate

- name: Ensure rsyslog is unmasked, enabled, and active when systemd is available
  ansible.builtin.systemd_service:
    name: rsyslog.service
    masked: false
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - rsyslog
    - service

# RedHat systems include /etc/rsyslog.d configuration before default rules.
# This role keeps the include directive at the end of the main configuration.
- name: Render main rsyslog configuration file
  ansible.builtin.template:
    src: "rsyslog_{{ ansible_facts['os_family'] }}.conf.j2"
    dest: "{{ rsyslog_conf_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart rsyslog
  tags:
    - rsyslog
    - config

- name: Ensure rsyslog default file permissions are configured
  ansible.builtin.lineinfile:
    path: "{{ rsyslog_conf_path }}"
    regexp: '^\$FileCreateMode\s+'
    line: "$FileCreateMode 0640"
    mode: "0644"
    create: true
    state: present
  notify: Restart rsyslog
  tags:
    - rsyslog
    - config

- name: Render rsyslog default logging rules
  ansible.builtin.template:
    src: "{{ rsyslog_file }}"
    dest: "{{ rsyslogd_path }}/50-default.conf"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart rsyslog
  tags:
    - rsyslog
    - config

- name: Render remote rsyslog forwarding configuration
  ansible.builtin.template:
    src: 01-Forward.conf.j2
    dest: "{{ rsyslogd_path }}/01-Forward.conf"
    owner: root
    group: root
    mode: "0640"
  when: rsyslog_log_server | length > 0
  notify: Restart rsyslog
  tags:
    - rsyslog
    - config

- name: Remove remote forwarding configuration when disabled
  ansible.builtin.file:
    path: "{{ rsyslogd_path }}/01-Forward.conf"
    state: absent
  when: rsyslog_log_server | length == 0
  notify: Restart rsyslog
  tags:
    - rsyslog
    - config

- name: Remove role-owned listener configuration on client systems
  ansible.builtin.file:
    path: "{{ rsyslogd_path }}/10-loghost.conf"
    state: absent
  when: not rsyslog_enable_log_host
  notify: Restart rsyslog
  tags:
    - rsyslog
    - config

- name: Find rsyslog drop-in configuration files
  ansible.builtin.find:
    paths: "{{ rsyslogd_path }}"
    patterns: "*.conf"
  register: rsyslog_module_found
  tags:
    - rsyslog
    - config

- name: Comment legacy remote forwarding syntax
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^(\*\.\*\s@@.+)$'
    line: '#\1'
    backrefs: true
  loop: "{{ rsyslog_module_found.files + [{'path': rsyslog_conf_path}] }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart rsyslog
  tags:
    - rsyslog
    - config

- name: Disable log-host listener configuration on non-log hosts
  when: not rsyslog_enable_log_host
  tags:
    - rsyslog
    - config
  block:
    - name: Comment legacy imtcp module loading on non-log hosts
      ansible.builtin.lineinfile:
        dest: "{{ item.path }}"
        regexp: '^(\$ModLoad\s+imtcp.*)$'
        line: '#\1'
        backrefs: true
      loop: "{{ rsyslog_module_found.files + [{'path': rsyslog_conf_path}] }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Restart rsyslog
      tags:
        - rsyslog
        - config

    - name: Comment modern input module loading on non-log hosts
      ansible.builtin.lineinfile:
        dest: "{{ item.path }}"
        regexp: '^(module\(load="(?:imudp|imtcp)"\).*)$'
        line: '#\1'
        backrefs: true
      loop: "{{ rsyslog_module_found.files + [{'path': rsyslog_conf_path}] }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Restart rsyslog
      tags:
        - rsyslog
        - config

    - name: Comment legacy TCP listener on non-log hosts
      ansible.builtin.lineinfile:
        dest: "{{ item.path }}"
        regexp: '^(\$InputTCPServerRun.+)$'
        line: '#\1'
        backrefs: true
      loop: "{{ rsyslog_module_found.files + [{'path': rsyslog_conf_path}] }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Restart rsyslog
      tags:
        - rsyslog
        - config

    - name: Comment modern TCP or UDP listener on non-log hosts
      ansible.builtin.lineinfile:
        dest: "{{ item.path }}"
        regexp: '^(input\(type="(?:imudp|imtcp)" port=".+"\).*)$'
        line: '#\1'
        backrefs: true
      loop: "{{ rsyslog_module_found.files + [{'path': rsyslog_conf_path}] }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Restart rsyslog
      tags:
        - rsyslog
        - config

- name: Configure listener settings on designated log hosts
  when: rsyslog_enable_log_host
  tags:
    - rsyslog
    - config
  block:
    - name: Enable imtcp module on log hosts
      ansible.builtin.lineinfile:
        dest: "{{ rsyslogd_path }}/10-loghost.conf"
        regexp: '^#?\s*(module\(load="imtcp"\).*)$'
        line: 'module(load="imtcp")'
        create: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart rsyslog
      tags:
        - rsyslog
        - config

    - name: Enable TCP listener on configured rsyslog port
      ansible.builtin.lineinfile:
        dest: "{{ rsyslogd_path }}/10-loghost.conf"
        regexp: '^#?\s*(input\(type="(?:imudp|imtcp)" port=".+"\).*)$'
        line: 'input(type="imtcp" port="{{ rsyslog_port }}")'
        create: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart rsyslog
      tags:
        - rsyslog
        - config
