---
- name: Check mandatory rsyslog variable values
  ansible.builtin.assert:
    that:
      - rsyslog_file is defined
      - rsyslog_file is string
      - rsyslog_file | length > 0
      - rsyslog_cis_level1_enabled | type_debug == 'bool'
      - rsyslog_cis_level2_enabled | type_debug == 'bool'
      - rsyslog_enable_log_host | type_debug == 'bool'
      - rsyslog_port | int >= 1
      - rsyslog_port | int <= 65535
      - rsyslog_log_server is string
      - rsyslog_retry_count | int >= -1
      - rsyslog_max_disk_space is string
      - rsyslog_max_disk_space | length > 0
      - rsyslog_save_on_shutdown in ['on', 'off']
      - rsyslog_queue_filename is match('^[A-Za-z0-9_.-]+$')
      - "'/' not in rsyslog_queue_filename"
      - rsyslog_tls_enabled | type_debug == 'bool'
      - rsyslog_tls_ca_file is string
      - rsyslog_tls_ca_file | length > 0
      - rsyslog_tls_stream_driver == 'gtls'
      - rsyslog_tls_stream_driver_mode == '1'
      - rsyslog_tls_stream_driver_auth_mode is string
      - rsyslog_tls_stream_driver_auth_mode | length > 0
      - rsyslog_manage_logrotate | type_debug == 'bool'
      - rsyslog_logrotate_user is string
      - rsyslog_logrotate_user | length > 0
      - rsyslog_logrotate_group is string
      - rsyslog_logrotate_group | length > 0
      - rsyslog_logrotate_frequency in ['daily', 'weekly', 'monthly']
      - rsyslog_logrotate_rotate | int > 0
      - rsyslog_logrotate_maxage | int > 0
      - rsyslog_logrotate_compress | type_debug == 'bool'
      - rsyslog_logrotate_delaycompress | type_debug == 'bool'
      - rsyslog_logrotate_paths is sequence
      - rsyslog_logrotate_paths | length > 0
    quiet: true
  tags:
    - rsyslog
    - validate

- name: Validate CIS rsyslog client profile inputs
  ansible.builtin.assert:
    that:
      - rsyslog_log_server | length > 0
      - not rsyslog_enable_log_host
    fail_msg: >-
      The CIS rsyslog client profiles require rsyslog_log_server and do not
      permit rsyslog_enable_log_host=true.
    quiet: true
  when: rsyslog_cis_level1_enabled or rsyslog_cis_level2_enabled
  tags:
    - rsyslog
    - validate

- name: Validate CIS Level 2 TLS package support
  ansible.builtin.assert:
    that:
      - rsyslog_tls_package | length > 0
    fail_msg: >-
      TLS forwarding was requested but no rsyslog TLS package is mapped for
      this operating system family.
    quiet: true
  when: rsyslog_tls_effective_enabled
  tags:
    - rsyslog
    - validate
